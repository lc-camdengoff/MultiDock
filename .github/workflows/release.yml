# Publishes a new MultiDock version from GitHub instead of a Mac.
# Actions → Release → Run workflow, then enter the version and notes.
# Does the same thing as running ./release.sh locally.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version number, e.g. 1.2
        required: true
      notes:
        description: Release notes
        required: false

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Import signing certificate
        env:
          P12: ${{ secrets.MULTIDOCK_CERT_P12 }}
          PASSWORD: ${{ secrets.MULTIDOCK_CERT_PASSWORD }}
        run: |
          if [[ -z "$P12" ]]; then
            echo "::error::Missing the MULTIDOCK_CERT_P12 secret. Run tools/make_signing_cert.sh --upload once on your Mac."
            exit 1
          fi
          print -r -- "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          tools/import_signing_cert.sh "$RUNNER_TEMP/cert.p12" "$PASSWORD"
        shell: zsh {0}
      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          NOTES: ${{ inputs.notes }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./release.sh "$VERSION" "${NOTES:-MultiDock $VERSION}"
